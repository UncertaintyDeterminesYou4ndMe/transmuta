name: release

# 打 git tag（如 v0.1.0）即触发：交叉编译 4 个平台的二进制，
# 放入对应的 npm 平台子包，然后按「先子包后主包」的顺序发布到 npm。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的版本号（不带 v 前缀），仅手动触发时使用"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.pkg }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: darwin-arm64
            target: aarch64-apple-darwin
            runner: macos-14
          - pkg: darwin-x64
            target: x86_64-apple-darwin
            runner: macos-13
          - pkg: linux-x64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - pkg: linux-arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 Cargo 构建
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          fi

      - name: 交叉编译（release）
        env:
          # aarch64 交叉编译时指定链接器与 C/C++ 编译器（parquet 的 zstd/lz4 等 -sys 依赖需要）
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
        run: cargo build --release --target ${{ matrix.target }}

      - name: 收集二进制
        run: |
          mkdir -p out
          cp "target/${{ matrix.target }}/release/transmuta" "out/transmuta"
          chmod +x out/transmuta

      - name: 上传二进制产物
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.pkg }}
          path: out/transmuta
          retention-days: 1

  publish:
    name: publish to npm
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: 计算版本号
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: 下载所有平台二进制
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 将二进制放入对应平台子包
        run: |
          set -euo pipefail
          for pkg in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            mkdir -p "npm/platforms/$pkg/bin"
            cp "artifacts/bin-$pkg/transmuta" "npm/platforms/$pkg/bin/transmuta"
            chmod +x "npm/platforms/$pkg/bin/transmuta"
          done

      - name: 写入版本号
        run: node npm/scripts/set-version.mjs "${{ steps.ver.outputs.version }}"

      - name: 发布平台子包（先于主包）
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for pkg in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            echo "== 发布 transmuta-$pkg =="
            (cd "platforms/$pkg" && npm publish --access public)
          done

      - name: 发布主包
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
